name: android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java (CI only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked

      - name: Add NDK tool aliases for cargo-quad-apk compatibility
        run: |
          set -euxo pipefail
          CANDIDATES=(
            "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
            "/opt/hostedtoolcache/ndk/r25c/x64/toolchains/llvm/prebuilt/linux-x86_64/bin"
            "/usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          )
          for NDK_BIN in "${CANDIDATES[@]}"; do
            if [ -d "$NDK_BIN" ]; then
              cp -f "$NDK_BIN/llvm-ar" "$NDK_BIN/aarch64-linux-android-ar" || true
              cp -f "$NDK_BIN/ld.lld" "$NDK_BIN/aarch64-linux-android-ld" || true
              cp -f "$NDK_BIN/llvm-readelf" "$NDK_BIN/aarch64-linux-android-readelf" || true
              cp -f "$NDK_BIN/llvm-objcopy" "$NDK_BIN/aarch64-linux-android-objcopy" || true
              cp -f "$NDK_BIN/llvm-strip" "$NDK_BIN/aarch64-linux-android-strip" || true
              cp -f "$NDK_BIN/llvm-ranlib" "$NDK_BIN/aarch64-linux-android-ranlib" || true
              cp -f "$NDK_BIN/llvm-nm" "$NDK_BIN/aarch64-linux-android-nm" || true
              cp -f "$NDK_BIN/llvm-objdump" "$NDK_BIN/aarch64-linux-android-objdump" || true
              chmod +x "$NDK_BIN"/aarch64-linux-android-* || true
              ls -l "$NDK_BIN/aarch64-linux-android-readelf" || true
            fi
          done

      - name: Build APK
        id: build_apk
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: -Lnative=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/lib64/clang/14.0.7/lib/linux/aarch64 -C link-arg=-lc++abi
        run: |
          set -o pipefail
          mkdir -p target/ci-logs
          cargo quad-apk build --release --target aarch64-linux-android 2>&1 | tee target/ci-logs/android-build.log

      - name: Show build failure details
        if: steps.build_apk.outcome == 'failure'
        run: |
          LOG=target/ci-logs/android-build.log
          SUMMARY=target/ci-logs/android-build-summary.log
          if [ ! -f "$LOG" ]; then
            echo "Build log was not created." | tee "$SUMMARY"
          else
            grep -Ei "error:|failed|failure|Caused by|undefined reference|cannot find|not found|No such file|panicked|exception|could not compile|could not execute|linking with" "$LOG" \
              | tail -n 80 > "$SUMMARY" || true
            if [ ! -s "$SUMMARY" ]; then
              tail -n 120 "$LOG" > "$SUMMARY"
            fi
          fi

          echo "## Android APK build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Key lines:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=Android APK build::$safe"
          done < "$SUMMARY"
          exit 1

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/android-artifacts/release/apk/*.apk
